<!doctype html>
<html lang="hu" data-bs-theme="dark" data-theme="glass">
  <head>
    <meta charset="UTF-8" />
    <title>Kezdőlap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script>
      (function () {
        const savedTheme = localStorage.getItem("bookmarks-theme") || "glass";
        document.documentElement.setAttribute("data-theme", savedTheme);
        const bsTheme = savedTheme === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-bs-theme", bsTheme);
      })();
    </script>
  </head>
  <body class="p-4">
    <div class="container-fluid max-w-custom">
      <!-- Felső sáv / Témaváltó -->
      <div
        class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary-subtle header-container"
      >
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-bookmark-heart-fill fs-3 text-primary logo-icon"></i>
          <span class="fs-4 fw-bold tracking-tight">Kezdőlap</span>
        </div>
        <div class="theme-switcher d-flex gap-1 p-1 rounded-pill">
          <button
            class="btn btn-sm rounded-pill px-3 theme-btn"
            data-theme-val="light"
            title="Világos mód"
          >
            <i class="bi bi-sun-fill me-1"></i> Világos
          </button>
          <button
            class="btn btn-sm rounded-pill px-3 theme-btn"
            data-theme-val="dark"
            title="Sötét mód"
          >
            <i class="bi bi-moon-stars-fill me-1"></i> Sötét
          </button>
          <button
            class="btn btn-sm rounded-pill px-3 theme-btn"
            data-theme-val="glass"
            title="Chrome Füstüveg"
          >
            <i class="bi bi-layers-fill me-1"></i> Füstüveg
          </button>
        </div>
      </div>

      <!-- Speciális műveletek sáv -->
      <div
        id="actions-container"
        class="d-flex flex-column align-items-start mb-4"
      >
        <h2 class="text-left w-100 mb-3">Most szeretnék...</h2>
        <a
          id="open-messengers-group"
          href="#"
          class="btn btn-outline-primary rounded-pill px-4 py-2 action-btn shadow-sm"
        >
          <i class="bi bi-chat-left-text-fill me-2 text-info"></i> Csevegni
        </a>
        <a
          id="open-learn-group"
          href="#"
          class="btn btn-outline-primary rounded-pill px-4 py-2 action-btn shadow-sm"
        >
          <i class="bi bi-chat-left-text-fill me-2 text-info"></i> Tanulni
        </a>
      </div>

      <div>
        <div
          class="d-flex flex-wrap gap-4 justify-content-center p-3 mb-4 rounded glass-panel"
        >
          <input
            type="text"
            placeholder="Ask from Qwen..."
            class="form-control"
          />
          <button class="btn btn-primary">Ask</button>
        </div>
      </div>

      <!-- 1. szint: Fő könyvjelző sáv -->
      <div
        id="level-1-container"
        class="d-flex flex-wrap gap-4 justify-content-center p-3 mb-4 rounded glass-panel"
      >
        <!-- JS tölti fel -->
      </div>

      <!-- 2. szint: Dinamikus alsó sor -->
      <div id="level-2-wrapper" class="collapse">
        <div
          id="level-2-container"
          class="d-flex flex-wrap gap-3 justify-content-center p-4 rounded glass-panel position-relative"
        >
          <!-- JS tölti fel hover esetén -->
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
