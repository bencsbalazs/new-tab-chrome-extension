<!doctype html>
<html lang="hu" data-bs-theme="light" data-theme="chrome">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="nav_home">Kezdőlap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
  </head>
  <body class="p-4">
    <div class="container-fluid max-w-custom">
      <!-- Felső sáv / Témaváltó -->
      <div
        class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary-subtle header-container"
      >
        <div class="d-flex align-items-center gap-4">
          <div class="d-flex align-items-center gap-2">
            <i
              class="bi bi-bookmark-heart-fill fs-3 text-primary logo-icon"
            ></i>
            <span class="fs-4 fw-bold tracking-tight" data-i18n="nav_home">Kezdőlap</span>
          </div>
          <!-- Anchors Menu -->
          <nav
            class="d-flex align-items-center gap-3 ms-2 header-nav"
            aria-label="Navigációs menü"
          >
            <a
              href="#konyvjelzok"
              class="nav-link-custom py-1 px-2 rounded fw-medium text-decoration-none small"
              data-i18n="nav_bookmarks"
              >Könyvjelzők</a
            >
            <a
              href="#feladatkor"
              class="nav-link-custom py-1 px-2 rounded fw-medium text-decoration-none small"
              data-i18n="nav_tasks"
              >Feladatkör</a
            >
          </nav>
        </div>

        <div class="d-flex gap-3 align-items-center">
          <div class="lang-switcher d-flex gap-1 p-1 rounded-pill">
            <button class="btn btn-sm rounded-pill px-2 lang-btn" data-lang-val="en" title="English">🇬🇧</button>
            <button class="btn btn-sm rounded-pill px-2 lang-btn" data-lang-val="hu" title="Magyar">🇭🇺</button>
            <button class="btn btn-sm rounded-pill px-2 lang-btn" data-lang-val="et" title="Eesti">🇪🇪</button>
          </div>
          <div class="theme-switcher d-flex gap-1 p-1 rounded-pill">
            <button
              class="btn btn-sm rounded-pill px-3 theme-btn"
              data-theme-val="light"
              title="Világos mód"
            >
              <i class="bi bi-sun-fill me-1"></i> <span data-i18n="theme_light">Világos</span>
            </button>
            <button
              class="btn btn-sm rounded-pill px-3 theme-btn"
              data-theme-val="dark"
              title="Sötét mód"
            >
              <i class="bi bi-moon-stars-fill me-1"></i> <span data-i18n="theme_dark">Sötét</span>
            </button>
            <button
              class="btn btn-sm rounded-pill px-3 theme-btn"
              data-theme-val="chrome"
              title="Chrome (Google-szerű)"
            >
              <i class="bi bi-google me-1"></i> <span data-i18n="theme_chrome">Chrome</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Fő tartalom -->
      <div class="row g-4" id="main-layout-row">
        <div class="col-12" id="bookmarks-col">
          <!-- Speciális műveletek sáv -->
          <div
            id="feladatkor"
            class="d-flex align-items-center gap-3 mb-4 flex-wrap"
          >
            <h2 class="m-0 fs-5 fw-bold text-muted" data-i18n="section_tasks_title">Most szeretnék...</h2>
            <div class="d-flex gap-2">
              <a
                id="open-messengers-group"
                href="#"
                class="btn btn-outline-primary rounded-pill px-4 py-2 action-btn shadow-sm"
              >
                <i class="bi bi-chat-left-text-fill me-2 text-info"></i>
                <span data-i18n="btn_chat">Csevegni</span>
              </a>
              <a
                id="open-learn-group"
                href="#"
                class="btn btn-outline-primary rounded-pill px-4 py-2 action-btn shadow-sm"
              >
                <i class="bi bi-mortarboard-fill me-2 text-info"></i> <span data-i18n="btn_learn">Tanulni</span>
              </a>
            </div>
          </div>

          <!-- Könyvjelzők szekció -->
          <div id="konyvjelzok">
            <!-- 1. szint: Fő könyvjelző sáv -->
            <div
              id="level-1-container"
              class="d-flex flex-wrap gap-4 justify-content-center p-3 mb-4 rounded glass-panel"
            >
              <!-- JS tölti fel -->
            </div>

            <!-- 2. szint: Dinamikus alsó sor -->
            <div id="level-2-wrapper" class="collapse">
              <div
                id="level-2-container"
                class="d-flex flex-wrap gap-3 justify-content-center p-4 rounded glass-panel position-relative"
              >
                <!-- JS tölti fel hover esetén -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
